name: gate-test (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env: { TZ: America/New_York, GH_TOKEN: "${{ github.token }}", EVENT: schedule }
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "--- daily gate, now $(date)"; bash -x .github/gate.sh
          echo "--- daily gate, manual run"; EVENT=workflow_dispatch bash .github/gate.sh
          echo "--- daily gate, nothing saved yet (prefix changed)"; sed 's/"Market read"/"No such prefix"/' .github/gate.sh > /tmp/g.sh; bash /tmp/g.sh
          echo "--- weekly gate"; bash .github/gate_weekly_test.sh
          echo "--- since for Sunday 18:00 in winter / summer"
          date -u -d 'TZ="America/New_York" 2026-11-22 18:00' +%FT%TZ; date -u -d 'TZ="America/New_York" 2026-07-12 18:00' +%FT%TZ
