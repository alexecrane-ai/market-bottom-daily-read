name: Market Bottom Daily Read

on:
  schedule:
    # Weekdays, 10am and 3pm New York time. Cron is in UTC and GitHub's timer can be late
    # or skip, so it wakes at :05, :25 and :45 across the summer and winter UTC hours.
    # .github/gate.sh runs the first wake-up in each window and skips the rest.
    - cron: "5,25,45 14,15,16,19,20,21 * * 1-5"
  workflow_dispatch:          # "Run workflow" button (works from the GitHub mobile app)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-read
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always use the latest code, even when re-running an old run

      - name: Gate on New York time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/gate.sh

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Run tracker
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --quiet pandas
          python market_tracker.py

      - name: Save daily log
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "market-read-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv index.html stamp.txt
          git commit -m "Market read $(date '+%Y-%m-%d %H:%M %Z')" || echo "No changes"
          # If another run saved first, put this run's report on top of it and retry.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - name: Package site
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p _site && cp index.html history.csv stamp.txt _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: _site

      - name: Publish to phone URL
        id: deploy
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub's publish step sometimes fails for a moment; wait and try once more.
      - name: Retry publish
        if: steps.gate.outputs.run == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Publish to phone URL (retry)
        if: steps.gate.outputs.run == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
